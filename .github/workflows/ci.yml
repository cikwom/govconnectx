name: GovConnectX CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "ci/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: govconnectx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend syntax and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./ci-test.db
      JWT_SECRET: ci-only-not-a-production-secret-please-replace
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q app
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Upload backend test database on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-database
          path: backend/ci-test.db
          if-no-files-found: ignore

  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
