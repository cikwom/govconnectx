name: Frontend build
on:
  push:
    branches: [main, feature/frontend-foundation-phase-5, feature/admin-command-centre-phase-9, feature/admin-oversight-enforcement-phase-10, feature/public-home-theme-login-phase-11, feature/civic-identity-theme-phase-12, feature/geographical-zones-phase-1]
  pull_request:
    branches: [main, feature/production-database-safety-phase-1, feature/admin-command-centre-phase-9, feature/admin-oversight-enforcement-phase-10, feature/public-home-theme-login-phase-11]
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Type-check and build frontend
        run: npm run build
