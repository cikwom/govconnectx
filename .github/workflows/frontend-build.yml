name: Frontend build
on:
  push:
    branches: [main, feature/frontend-foundation-phase-5, feature/admin-command-centre-phase-9, feature/admin-oversight-enforcement-phase-10, feature/public-home-theme-login-phase-11, feature/civic-identity-theme-phase-12, feature/geographical-zones-phase-1, feature/geographical-zones-phase-2, feature/report-photo-video-evidence]
  pull_request:
    branches: [main, feature/production-database-safety-phase-1, feature/geographical-zones-phase-1, feature/admin-command-centre-phase-9, feature/admin-oversight-enforcement-phase-10, feature/public-home-theme-login-phase-11]
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install
      # Keep the production dependency tree on a strict high-severity gate.
      # Build tooling is audited separately at critical severity because an
      # upstream high-severity advisory currently has no published fixed release.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit full dependency tree for critical advisories
        run: npm audit --audit-level=critical
      - name: Check translation completeness
        run: npm run check:translations
      - name: Type-check and build frontend
        run: npm run build
